<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#294C3A"/><rect x="70" y="72" width="150" height="10" rx="5" fill="#D8B75A"/><text x="70" y="135" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="4">RONCEGNO TERME</text><text x="70" y="390" fill="#FFFFFF" font-family="Cormorant Garamond, Georgia, serif" font-size="88" font-weight="700"><tspan x="70" dy="0">Un paese</tspan><tspan x="70" dy="96">da raccontare.</tspan></text><text x="70" y="680" fill="#F4F0E6" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="600"><tspan x="70" dy="0">Persone. Comunità. Territorio.</tspan><tspan x="70" dy="58">Cultura. Tradizioni.</tspan></text><text x="70" y="865" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="31"><tspan x="70" dy="0">Roncegno Terme non è fatto soltanto di luoghi,</tspan><tspan x="70" dy="50">ma delle persone che li vivono.</tspan></text><line x1="70" y1="1190" x2="1010" y2="1190" stroke="#D8B75A" stroke-width="3"/><text x="70" y="1260" fill="#F4F0E6" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">03 / 04</text></svg>